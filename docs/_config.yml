# Jekyll configuration for the LWS documentation site.
# Built by GitHub Pages from the docs/ folder of the main branch.
# Local build: see docs/README.md.

title: LWS
tagline: Linux Web Services
description: >-
  LWS is a command-line tool and REST API for managing Proxmox VE hosts, LXC
  containers and the Docker workloads inside them, over SSH.
lang: en
url: "https://fabriziosalmi.github.io"
baseurl: "/lws"
repository: fabriziosalmi/lws
repository_url: https://github.com/fabriziosalmi/lws
author: Fabrizio Salmi

# The released version shown on the site. tests/test_docs_site.py fails if it
# differs from `version` in pyproject.toml.
lws_version: "1.4.3"

# Image used for link previews when a page does not set its own.
social_image: /assets/img/og-image.png

# No theme. The site has its own layouts (_layouts/) and stylesheets
# (assets/css/). `null` has to be explicit: when the key is missing, GitHub
# Pages applies jekyll-theme-primer, whose assets/css/style.scss is written to
# the same path as this site's assets/css/style.css.
theme: null

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  # Rouge emits class names only; the colours live in assets/css/docs.css.
  syntax_highlighter_opts:
    css_class: highlight

# The pages/ collection keeps its existing URLs (/lws/pages/<name>.html), which
# search engines have already indexed.
collections:
  pages:
    output: true
    permalink: /pages/:name.html

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
