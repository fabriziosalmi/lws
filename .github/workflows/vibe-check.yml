name: Vibe Check
on: [push, pull_request,workflow_dispatch]

jobs:
  vibe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run VibeGuard Auditor
        uses: fabriziosalmi/vibe-check@v1.4.0
        with:
          # Optional: Set your own quality bar (Default: 800)
          threshold: 850
